<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Live</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-top">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="m9 9-2.5 3L9 15M15 9l2.5 3L15 15" /></svg>
            <span>Codex Live</span>
          </div>
        </div>
        <div class="new-chat-row">
          <button id="btnNew" class="new-chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
            <span id="btnNewLabel">新对话</span>
          </button>
        </div>
        <div id="projectSection" class="side-section">项目</div>
        <div id="projectList" class="side-list"></div>
        <button id="btnAddProject" class="side-mini">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          <span>添加项目文件夹</span>
        </button>
        <div class="side-section">会话</div>
        <div id="threadList" class="side-list"></div>
        <div class="side-spacer"></div>
        <div class="side-foot">
          <button id="btnTheme" class="side-foot-btn" title="切换深浅色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
            <span>深浅色</span>
          </button>
          <div class="side-foot-meta">
            <div>线程 <span id="sideThread">—</span></div>
            <div>本地实时桥 · codex app-server 通道</div>
          </div>
        </div>
      </aside>

      <main id="main">
        <header class="main-top">
          <button id="btnSide" class="icon-btn" title="折叠/展开侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
          </button>
          <span id="connDot" class="dot off"></span>
          <span id="connText">连接中…</span>
          <span class="grow"></span>
          <span id="cwdLabel" class="cwd-label"></span>
          <span id="turnMeta" class="turn-meta"></span>
        </header>

        <div id="scroller">
          <div id="messages" class="messages">
            <div class="hero" id="hero">
              <div class="hero-mark">⌘</div>
              <h1>我们要聊点什么?</h1>
            </div>
          </div>
        </div>

        <button id="toBottom" class="to-bottom hidden" title="回到底部">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14" /><path d="m5 12 7 7 7-7" /></svg>
        </button>

        <footer class="composer-wrap">
          <div class="composer">
            <textarea id="input" rows="1" placeholder="随心输入"></textarea>
            <div class="composer-bar">
              <div class="composer-left">
                <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></svg>
                <span id="permLabel">—</span>
              </div>
              <div class="composer-right">
                <span class="model-tag" id="modelTag">—</span>
                <button id="btnStop" class="round-btn stop hidden" title="停止">
                  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2" /></svg>
                </button>
                <button id="btnSend" class="round-btn send" title="发送" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="composer-note">ZCode ←→ ChatGPT · codex app-server 通道 · 回车发送，Shift+回车换行</div>
        </footer>
      </main>
      <div id="sideResizer" title="拖拽调整宽度"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
